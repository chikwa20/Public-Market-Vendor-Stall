<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supervisor Dashboard – PMSVS</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="system-page">
<div class="layout">

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo"><i class="ri-store-2-line"></i></div>
      <div class="sidebar-brand">
        <span class="sidebar-title">MarketVend</span>
        <span class="sidebar-sub">Supervisor</span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="supervisor-dashboard.html" class="nav-item active">
        <i class="ri-dashboard-line nav-icon"></i> Dashboard
      </a>
      <div class="nav-divider"></div>
      <span class="sidebar-section-label">Management</span>
      <a href="vendors.html" class="nav-item">
        <i class="ri-group-line nav-icon"></i> Vendors
      </a>
      <a href="stalls.html" class="nav-item">
        <i class="ri-store-line nav-icon"></i> Stalls
      </a>
      <a href="payments.html" class="nav-item">
        <i class="ri-bank-card-line nav-icon"></i> Payment &amp; Billing
      </a>
      <a href="utilities.html" class="nav-item">
        <i class="ri-flashlight-line nav-icon"></i> Utilities
      </a>
      <a href="violations.html" class="nav-item">
        <i class="ri-error-warning-line nav-icon"></i> Violations
      </a>
      <div class="nav-divider"></div>
      <span class="sidebar-section-label">Staff</span>
      <a href="collector.html" class="nav-item">
        <i class="ri-user-star-line nav-icon"></i> Collectors
      </a>
      <a href="reports.html" class="nav-item">
        <i class="ri-bar-chart-line nav-icon"></i> Reports
      </a>
      <div class="nav-divider"></div>
      <a href="#" class="nav-item nav-logout" onclick="logout()">
        <i class="ri-logout-box-line nav-icon"></i> Logout
      </a>
    </nav>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <h1 class="page-title">Dashboard</h1>
        <span class="breadcrumb">Home / Dashboard</span>
      </div>
      <div class="topbar-right">
        <div class="user-badge">
          <div class="user-avatar" id="avatarInitial">S</div>
          <span class="user-info" id="userInfo">Supervisor</span>
        </div>
        <span class="date-today" id="dateToday"></span>
      </div>
    </div>

    <div class="cards-grid" id="statsGrid"></div>

    <div style="display:flex;flex-wrap:wrap;gap:20px;padding:16px 28px 28px;">
      <div class="table-section" style="flex:1;min-width:280px;margin:0;">
        <div class="table-header">
          <h2 class="table-title">Stall Status</h2>
          <a href="stalls.html" style="font-size:12px;color:var(--green);font-weight:600;">View All</a>
        </div>
        <div class="table-wrapper">
          <table class="data-table">
            <thead><tr><th>Stall</th><th>Section</th><th>Vendor</th><th>Status</th></tr></thead>
            <tbody id="stallsPreview"></tbody>
          </table>
        </div>
      </div>

      <div class="table-section" style="flex:1;min-width:280px;margin:0;">
        <div class="table-header">
          <h2 class="table-title">Recent Collections</h2>
          <a href="payments.html" style="font-size:12px;color:var(--green);font-weight:600;">View All</a>
        </div>
        <div class="table-wrapper">
          <table class="data-table">
            <thead><tr><th>Ref</th><th>Stall</th><th>Amount</th><th>Date</th></tr></thead>
            <tbody id="collectionsPreview"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="js/app.js"></script>
<script>
  var session = requireAuth(['supervisor']);

  document.addEventListener('DOMContentLoaded', function(){
    var stalls     = dbGet(KEYS.stalls,     SEED_STALLS);
    var vendors    = dbGet(KEYS.vendors,    SEED_VENDORS);
    var payments   = dbGet(KEYS.payments,   SEED_PAYMENTS);
    var bills      = dbGet(KEYS.bills,      SEED_BILLS);
    var utilities  = dbGet(KEYS.utilities,  SEED_UTILITIES);
    var violations = dbGet(KEYS.violations, SEED_VIOLATIONS);

    var totalStalls    = stalls.length;
    var occupied       = stalls.filter(function(s){ return s.status==='Occupied'; }).length;
    var vacant         = stalls.filter(function(s){ return s.status==='Vacant'; }).length;
    var totalVendors   = vendors.filter(function(v){ return v.status==='Active'; }).length;
    var totalCollected = payments.reduce(function(sum,p){ return sum+p.amount; },0);
    var outstanding    = bills.reduce(function(sum,b){ return sum+(b.amount-b.paid); },0);
    var unpaidUtil     = utilities.filter(function(u){ return u.status==='Unpaid'; }).length;
    var openViol       = violations.filter(function(v){ return v.status==='Open'; }).length;

    document.getElementById('statsGrid').innerHTML = [
      card('ri-store-line',           'Total Stalls',       totalStalls,    occupied+' occupied, '+vacant+' vacant', ''),
      card('ri-checkbox-circle-line', 'Occupied Stalls',    occupied,       Math.round(occupied/totalStalls*100)+'% occupancy', 'card-green'),
      card('ri-group-line',           'Active Vendors',     totalVendors,   'Registered &amp; active', 'card-blue'),
      card('ri-money-dollar-circle-line','Total Collections','&#8369;'+totalCollected.toLocaleString(), 'All recorded payments', 'card-green'),
      card('ri-alarm-warning-line',   'Outstanding',        '&#8369;'+outstanding.toLocaleString(), 'Unpaid bill balances', 'card-orange'),
      card('ri-flashlight-line',      'Unpaid Utilities',   unpaidUtil,     'Water &amp; electricity bills', 'card-orange'),
      card('ri-error-warning-line',   'Open Violations',    openViol,       'Unresolved violations', 'card-red')
    ].join('');

    var sb = '';
    stalls.slice(0,8).forEach(function(s){
      var vnd = s.vendorId ? vendors.find(function(v){ return v.id===s.vendorId; }) : null;
      var cls = s.status==='Occupied'?'badge-occupied':s.status==='Vacant'?'badge-vacant':'badge-maintenance';
      sb += '<tr><td>'+escHtml(s.number)+'</td><td>'+escHtml(s.section)+'</td><td>'+(vnd?escHtml(vnd.name):'—')+'</td><td><span class="badge '+cls+'">'+escHtml(s.status)+'</span></td></tr>';
    });
    document.getElementById('stallsPreview').innerHTML = sb || '<tr><td colspan="4" style="text-align:center;color:#aaa;padding:16px;">No stalls</td></tr>';

    var pb = '';
    payments.slice(-6).reverse().forEach(function(p){
      pb += '<tr><td>'+escHtml(p.ref)+'</td><td>'+escHtml(p.stall)+'</td><td>&#8369;'+p.amount+'</td><td>'+escHtml(p.date)+'</td></tr>';
    });
    document.getElementById('collectionsPreview').innerHTML = pb || '<tr><td colspan="4" style="text-align:center;color:#aaa;padding:16px;">No payments</td></tr>';
  });

  function card(icon, label, val, sub, cls) {
    return '<div class="card '+cls+'"><i class="'+icon+' card-icon"></i><div class="card-label">'+label+'</div><div class="card-value">'+val+'</div><div class="card-sub">'+sub+'</div></div>';
  }
</script>
</body>
</html>
