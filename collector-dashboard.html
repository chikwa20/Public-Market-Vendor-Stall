<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collector Dashboard – PMSVS</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="system-page">
<div class="layout">

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo"><i class="ri-user-star-line"></i></div>
      <div class="sidebar-brand">
        <span class="sidebar-title">MarketVend</span>
        <span class="sidebar-sub">Collector</span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="collector-dashboard.html" class="nav-item active">
        <i class="ri-dashboard-line nav-icon"></i> Dashboard
      </a>
      <div class="nav-divider"></div>
      <a href="#" class="nav-item nav-logout" onclick="logout()">
        <i class="ri-logout-box-line nav-icon"></i> Logout
      </a>
    </nav>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <h1 class="page-title">Collector Dashboard</h1>
        <span class="breadcrumb">Home / Collections</span>
      </div>
      <div class="topbar-right">
        <div class="user-badge">
          <div class="user-avatar" id="avatarInitial">C</div>
          <span class="user-info" id="userInfo">Collector</span>
        </div>
        <span class="date-today" id="dateToday"></span>
      </div>
    </div>

    <div class="cards-grid" id="colStatsGrid"></div>

    <div class="table-section" style="margin:16px 28px 28px;">
      <div class="table-header">
        <h2 class="table-title">Collection Records</h2>
      </div>
      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th>Ref #</th><th>Stall</th><th>Amount</th>
              <th>Method</th><th>Date</th><th>Time</th>
            </tr>
          </thead>
          <tbody id="myCollections"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="js/app.js"></script>
<script>
  var session = requireAuth(['collector']);

  document.addEventListener('DOMContentLoaded', function(){
    var payments  = dbGet(KEYS.payments, SEED_PAYMENTS);
    var today     = new Date().toISOString().slice(0,10);
    var thisMonth = today.slice(0,7);

    var todayPays  = payments.filter(function(p){ return p.date===today; });
    var monthPays  = payments.filter(function(p){ return p.date.startsWith(thisMonth); });
    var todayTotal = todayPays.reduce(function(s,p){ return s+p.amount; },0);
    var monthTotal = monthPays.reduce(function(s,p){ return s+p.amount; },0);
    var allTotal   = payments.reduce(function(s,p){ return s+p.amount; },0);

    document.getElementById('colStatsGrid').innerHTML = [
      card('ri-calendar-line',       "Today's Collections", '&#8369;'+todayTotal.toLocaleString(), todayPays.length+' transactions today',      'card-blue'),
      card('ri-calendar-check-line', 'This Month',          '&#8369;'+monthTotal.toLocaleString(), monthPays.length+' transactions this month',  'card-green'),
      card('ri-money-dollar-circle-line','All Time Total',  '&#8369;'+allTotal.toLocaleString(),   payments.length+' total transactions',        '')
    ].join('');

    var tb = '';
    payments.slice().reverse().forEach(function(p){
      tb += '<tr><td>'+escHtml(p.ref)+'</td><td>'+escHtml(p.stall)+'</td><td>&#8369;'+p.amount+'</td><td>'+escHtml(p.method)+'</td><td>'+escHtml(p.date)+'</td><td>'+escHtml(p.time)+'</td></tr>';
    });
    document.getElementById('myCollections').innerHTML = tb || '<tr><td colspan="6" style="text-align:center;color:#aaa;padding:16px;">No collections yet</td></tr>';
  });

  function card(icon, label, val, sub, cls) {
    return '<div class="card '+cls+'"><i class="'+icon+' card-icon"></i><div class="card-label">'+label+'</div><div class="card-value">'+val+'</div><div class="card-sub">'+sub+'</div></div>';
  }
</script>
</body>
</html>
