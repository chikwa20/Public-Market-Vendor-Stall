<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vendor Dashboard – PMSVS</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="system-page">
<div class="layout">

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo"><i class="ri-user-line"></i></div>
      <div class="sidebar-brand">
        <span class="sidebar-title">MarketVend</span>
        <span class="sidebar-sub">Vendor Portal</span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="vendor-dashboard.html" class="nav-item active">
        <i class="ri-dashboard-line nav-icon"></i> My Dashboard
      </a>
      <div class="nav-divider"></div>
      <a href="#" class="nav-item nav-logout" onclick="logout()">
        <i class="ri-logout-box-line nav-icon"></i> Logout
      </a>
    </nav>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <h1 class="page-title">Vendor Dashboard</h1>
        <span class="breadcrumb">Home / My Account</span>
      </div>
      <div class="topbar-right">
        <div class="user-badge">
          <div class="user-avatar" id="avatarInitial">V</div>
          <span class="user-info" id="userInfo">Vendor</span>
        </div>
        <span class="date-today" id="dateToday"></span>
      </div>
    </div>

    <div id="vendorContent" style="padding:24px 28px;">
      <p style="color:var(--text-muted);">Loading your information…</p>
    </div>
  </main>
</div>

<script src="js/app.js"></script>
<script>
  var session = requireAuth(['vendor']);

  document.addEventListener('DOMContentLoaded', function(){
    var vendors    = dbGet(KEYS.vendors,    SEED_VENDORS);
    var stalls     = dbGet(KEYS.stalls,     SEED_STALLS);
    var bills      = dbGet(KEYS.bills,      SEED_BILLS);
    var payments   = dbGet(KEYS.payments,   SEED_PAYMENTS);
    var utilities  = dbGet(KEYS.utilities,  SEED_UTILITIES);
    var violations = dbGet(KEYS.violations, SEED_VIOLATIONS);

    var vendor = vendors.find(function(v){ return v.userId === session.id; });
    if (!vendor) {
      document.getElementById('vendorContent').innerHTML =
        '<div style="background:#fff;border-radius:10px;padding:40px;text-align:center;border:1px solid var(--border);box-shadow:var(--shadow-sm);">' +
        '<i class="ri-store-line" style="font-size:48px;color:var(--green);opacity:.3;display:block;margin-bottom:16px;"></i>' +
        '<p style="font-size:15px;color:var(--text-muted);line-height:1.7;">No vendor profile is linked to your account.<br>Please contact the Market Supervisor.</p></div>';
      return;
    }

    var stall       = vendor.stallId ? stalls.find(function(s){ return s.id===vendor.stallId; }) : null;
    var myBills     = bills.filter(function(b){ return b.vendorId===vendor.id; });
    var myPays      = payments.filter(function(p){ return p.vendorId===vendor.id; });
    var myUtil      = utilities.filter(function(u){ return u.vendorId===vendor.id; });
    var myViol      = violations.filter(function(v){ return v.vendorId===vendor.id; });
    var outstanding = myBills.reduce(function(sum,b){ return sum+(b.amount-b.paid); },0);
    var totalPaid   = myPays.reduce(function(sum,p){ return sum+p.amount; },0);
    var utilOwed    = myUtil.filter(function(u){ return u.status!=='Paid'; }).reduce(function(sum,u){ return sum+u.amount; },0);
    var openViol    = myViol.filter(function(v){ return v.status==='Open'; }).length;

    var html = '<div class="cards-grid" style="padding:0 0 20px;">';
    html += card2('ri-store-line',            'My Stall',        stall ? stall.number : 'Unassigned', stall ? stall.section : 'No stall assigned', '');
    html += card2('ri-file-text-line',        'Lease End',       vendor.leaseEnd || 'N/A',            'Started: '+(vendor.leaseStart||'N/A'), 'card-blue');
    html += card2('ri-money-dollar-circle-line','Total Paid',    '₱'+totalPaid.toLocaleString(),       'All payments combined', 'card-green');
    html += card2('ri-alarm-warning-line',    'Outstanding',     '₱'+outstanding.toLocaleString(),      'Unpaid balance', outstanding>0?'card-orange':'card-green');
    html += card2('ri-flashlight-line',       'Utility Balance', '₱'+utilOwed.toLocaleString(),         'Water &amp; electricity', utilOwed>0?'card-orange':'card-green');
    html += card2('ri-error-warning-line',    'Open Violations', openViol,                              'Unresolved violations', openViol>0?'card-red':'card-green');
    html += '</div>';

    // Bills table
    html += '<div class="table-section"><div class="table-header"><h2 class="table-title">My Bills</h2></div><div class="table-wrapper"><table class="data-table"><thead><tr><th>Bill ID</th><th>Period</th><th>Due Date</th><th>Amount</th><th>Paid</th><th>Balance</th><th>Status</th></tr></thead><tbody>';
    if (myBills.length) {
      myBills.forEach(function(b){
        var cls = b.status==='Paid'?'badge-active':b.status==='Unpaid'?'badge-inactive':'badge-pending';
        html += '<tr><td>'+escHtml(b.id)+'</td><td>'+escHtml(b.period)+'</td><td>'+escHtml(b.dueDate)+'</td><td>₱'+b.amount+'</td><td>₱'+b.paid+'</td><td>₱'+(b.amount-b.paid)+'</td><td><span class="badge '+cls+'">'+escHtml(b.status)+'</span></td></tr>';
      });
    } else {
      html += '<tr><td colspan="7" style="text-align:center;color:#aaa;padding:16px;">No bills found</td></tr>';
    }
    html += '</tbody></table></div></div>';

    // Utility bills
    if (myUtil.length) {
      html += '<div class="table-section" style="margin-top:16px;"><div class="table-header"><h2 class="table-title">My Utility Bills</h2></div><div class="table-wrapper"><table class="data-table"><thead><tr><th>Bill ID</th><th>Type</th><th>Period</th><th>Usage</th><th>Amount</th><th>Status</th></tr></thead><tbody>';
      myUtil.forEach(function(u){
        var cls = u.status==='Paid'?'badge-active':u.status==='Unpaid'?'badge-inactive':'badge-pending';
        html += '<tr><td>'+escHtml(u.id)+'</td><td>'+escHtml(u.type)+'</td><td>'+escHtml(u.period)+'</td><td>'+escHtml(u.usage||'—')+'</td><td>₱'+u.amount+'</td><td><span class="badge '+cls+'">'+escHtml(u.status)+'</span></td></tr>';
      });
      html += '</tbody></table></div></div>';
    }

    // Payment history
    html += '<div class="table-section" style="margin-top:16px;"><div class="table-header"><h2 class="table-title">Payment History</h2></div><div class="table-wrapper"><table class="data-table"><thead><tr><th>Ref #</th><th>Amount</th><th>Method</th><th>Date</th><th>Time</th></tr></thead><tbody>';
    if (myPays.length) {
      myPays.forEach(function(p){
        html += '<tr><td>'+escHtml(p.ref)+'</td><td>₱'+p.amount+'</td><td>'+escHtml(p.method)+'</td><td>'+escHtml(p.date)+'</td><td>'+escHtml(p.time)+'</td></tr>';
      });
    } else {
      html += '<tr><td colspan="5" style="text-align:center;color:#aaa;padding:16px;">No payments yet</td></tr>';
    }
    html += '</tbody></table></div></div>';

    document.getElementById('vendorContent').innerHTML = html;
  });

  function card2(icon, label, val, sub, cls) {
    return '<div class="card '+cls+'"><i class="'+icon+' card-icon"></i><div class="card-label">'+escHtml(label)+'</div><div class="card-value" style="font-size:22px;">'+val+'</div><div class="card-sub">'+escHtml(String(sub))+'</div></div>';
  }
</script>
</body>
</html>
