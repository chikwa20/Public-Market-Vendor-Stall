<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – Public Market Stall Vendor System</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <span class="auth-logo-icon"></span>
        <h1 class="auth-title">Public Market Stall<br>Vendor System</h1>
        <p class="auth-subtitle">Create your account</p>
      </div>

      <h2 class="auth-form-title">Register</h2>
      <p class="form-error" id="regError"></p>
      <p class="form-success" id="regSuccess"></p>

      <div class="form-group">
        <label>Full Name <span class="required">*</span></label>
        <input type="text" id="regName" class="form-input" placeholder="Enter your full name" />
      </div>
      <div class="form-group">
        <label>Email Address <span class="required">*</span></label>
        <input type="email" id="regEmail" class="form-input" placeholder="Enter your email" />
      </div>
      <div class="form-group">
        <label>Password <span class="required">*</span></label>
        <input type="password" id="regPassword" class="form-input" placeholder="At least 6 characters" />
      </div>
      <div class="form-group">
        <label>Confirm Password <span class="required">*</span></label>
        <input type="password" id="regConfirm" class="form-input" placeholder="Re-enter password" />
      </div>
      <input type="hidden" id="regRole" value="vendor" />
      <div class="form-group">
        <label>Contact Number</label>
        <input type="text" id="regContact" class="form-input" placeholder="09XX-XXX-XXXX" />
      </div>

      <button class="btn-primary btn-full" onclick="doRegister()">Create Account</button>

      <div class="auth-footer">
        <p>Already have an account? <a href="login.html">Login here</a></p>
        <p style="margin-top:8px;"><a href="index.html">← Back to Home</a></p>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    function doRegister() {
      var name     = document.getElementById('regName').value.trim();
      var email    = document.getElementById('regEmail').value.trim().toLowerCase();
      var password = document.getElementById('regPassword').value;
      var confirm  = document.getElementById('regConfirm').value;
      var role     = document.getElementById('regRole').value;
      var contact  = document.getElementById('regContact').value.trim();
      var errEl    = document.getElementById('regError');
      var okEl     = document.getElementById('regSuccess');
      errEl.textContent = '';
      okEl.textContent  = '';

      if (!name)     { errEl.textContent = 'Full Name is required.'; return; }
      if (!email)    { errEl.textContent = 'Email is required.'; return; }
      if (password.length < 6) { errEl.textContent = 'Password must be at least 6 characters.'; return; }
      if (password !== confirm) { errEl.textContent = 'Passwords do not match.'; return; }

      var users = dbGet(KEYS.users, SEED_USERS);
      if (users.find(function(u){ return u.email.toLowerCase() === email; })) {
        errEl.textContent = 'An account with this email already exists.';
        return;
      }

      var newUser = {
        id:        nextAutoId('U', users),
        name:      name,
        email:     email,
        password:  password,
        role:      role,
        contact:   contact,
        status:    'Active',
        createdAt: new Date().toISOString().slice(0,10)
      };
      users.push(newUser);
      dbSet(KEYS.users, users);

      // If vendor, create vendor record placeholder
      if (role === 'vendor') {
        var vendors = dbGet(KEYS.vendors, SEED_VENDORS);
        var existing = vendors.find(function(v){ return v.userId === newUser.id; });
        if (!existing) {
          vendors.push({
            id: nextAutoId('VND', vendors), name: name, contact: contact,
            email: email, address: '', stallId: null, status: 'Active',
            userId: newUser.id, leaseStart: '', leaseEnd: ''
          });
          dbSet(KEYS.vendors, vendors);
        }
      }

      okEl.textContent = 'Account created successfully! Redirecting to login…';
      setTimeout(function(){ window.location.href = 'login.html'; }, 1800);
    }
  </script>
</body>
</html>
