<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – Public Market Stall Vendor System</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">

      <div class="auth-logo">
        <div class="auth-logo-icon">
          <i class="ri-store-2-line"></i>
        </div>
        <h1 class="auth-title">Public Market Stall<br>Vendor System</h1>
        <p class="auth-subtitle">Create your account</p>
      </div>

      <h2 class="auth-form-title">Register</h2>
      <p class="form-error"   id="regError"></p>
      <p class="form-success" id="regSuccess"></p>

      <div class="form-group">
        <label>Full Name <span class="required">*</span></label>
        <input type="text" id="regName" class="form-input" placeholder="Enter your full name" autocomplete="name" />
      </div>

      <div class="form-group">
        <label>Username <span class="required">*</span></label>
        <input type="text" id="regEmail" class="form-input" placeholder="Choose a username" autocomplete="username" />
      </div>

      <div class="form-group">
        <label>Contact Number</label>
        <input type="text" id="regContact" class="form-input" placeholder="09XX-XXX-XXXX" autocomplete="tel" />
      </div>

      <div class="form-group">
        <label>Password <span class="required">*</span></label>
        <div class="password-field">
          <input type="password" id="regPassword" class="form-input" placeholder="At least 6 characters" autocomplete="new-password" />
          <button type="button" class="password-toggle" onclick="togglePassword('regPassword', 'regPassIcon')" tabindex="-1" aria-label="Toggle password visibility">
            <i class="ri-eye-off-line" id="regPassIcon"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label>Confirm Password <span class="required">*</span></label>
        <div class="password-field">
          <input type="password" id="regConfirm" class="form-input" placeholder="Re-enter your password" autocomplete="new-password" />
          <button type="button" class="password-toggle" onclick="togglePassword('regConfirm', 'regConfirmIcon')" tabindex="-1" aria-label="Toggle confirm password visibility">
            <i class="ri-eye-off-line" id="regConfirmIcon"></i>
          </button>
        </div>
      </div>

      <input type="hidden" id="regRole" value="vendor" />

      <button class="btn-primary btn-full" onclick="doRegister()">
        <i class="ri-user-add-line"></i> Create Account
      </button>

      <div class="auth-footer">
        <p>Already have an account? <a href="login.html">Sign in here</a></p>
        <p><a href="index.html"><i class="ri-arrow-left-line"></i> Back to Home</a></p>
      </div>

    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    /* ---- password visibility toggle ---- */
    function togglePassword(inputId, iconId) {
      var input = document.getElementById(inputId);
      var icon  = document.getElementById(iconId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'ri-eye-line';
      } else {
        input.type = 'password';
        icon.className = 'ri-eye-off-line';
      }
    }

    /* ---- register ---- */
    function doRegister() {
      var name     = document.getElementById('regName').value.trim();
      var email    = document.getElementById('regEmail').value.trim().toLowerCase();
      var password = document.getElementById('regPassword').value;
      var confirm  = document.getElementById('regConfirm').value;
      var role     = document.getElementById('regRole').value;
      var contact  = document.getElementById('regContact').value.trim();
      var errEl    = document.getElementById('regError');
      var okEl     = document.getElementById('regSuccess');
      errEl.textContent = '';
      okEl.textContent  = '';

      if (!name)               { errEl.textContent = 'Full Name is required.'; return; }
      if (!email)              { errEl.textContent = 'Username is required.'; return; }
      if (password.length < 6) { errEl.textContent = 'Password must be at least 6 characters.'; return; }
      if (password !== confirm) { errEl.textContent = 'Passwords do not match.'; return; }

      var users = dbGet(KEYS.users, SEED_USERS);
      if (users.find(function(u){ return u.email.toLowerCase() === email; })) {
        errEl.textContent = 'That username is already taken.';
        return;
      }

      var newUser = {
        id:        nextAutoId('U', users),
        name:      name,
        email:     email,
        password:  password,
        role:      role,
        contact:   contact,
        status:    'Active',
        createdAt: new Date().toISOString().slice(0,10)
      };
      users.push(newUser);
      dbSet(KEYS.users, users);

      /* create vendor profile placeholder */
      if (role === 'vendor') {
        var vendors = dbGet(KEYS.vendors, SEED_VENDORS);
        var existing = vendors.find(function(v){ return v.userId === newUser.id; });
        if (!existing) {
          vendors.push({
            id: nextAutoId('VND', vendors), name: name, contact: contact,
            email: email, address: '', stallId: null, status: 'Active',
            userId: newUser.id, leaseStart: '', leaseEnd: ''
          });
          dbSet(KEYS.vendors, vendors);
        }
      }

      okEl.textContent = 'Account created! Redirecting to login…';
      setTimeout(function(){ window.location.href = 'login.html'; }, 1800);
    }

    document.addEventListener('keydown', function(e){
      if (e.key === 'Enter') doRegister();
    });
  </script>
</body>
</html>
