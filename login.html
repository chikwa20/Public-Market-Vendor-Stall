<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Public Market Stall Vendor System</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <span class="auth-logo-icon"></span>
        <h1 class="auth-title">Public Market Stall<br>Vendor System</h1>
        <p class="auth-subtitle">Minglanilla Public Market</p>
      </div>

      <h2 class="auth-form-title">Sign In</h2>
      <p class="form-error" id="loginError"></p>

      <div class="form-group">
        <label>Username <span class="required">*</span></label>
        <input type="text" id="loginEmail" class="form-input" placeholder="Enter your username" />
      </div>
      <div class="form-group">
        <label>Password <span class="required">*</span></label>
        <input type="password" id="loginPassword" class="form-input" placeholder="Enter your password" />
      </div>

      <button class="btn-primary btn-full" onclick="doLogin()">Login</button>

      <div class="auth-footer">
        <p>Don't have an account? <a href="register.html">Register here</a></p>
        <p style="margin-top:8px;"><a href="index.html">← Back to Home</a></p>
      </div>

      <div class="auth-demo">
        <p><strong>Demo Accounts:</strong></p>
        <p>Supervisor: perezvisor / perez123</p>
        <p>Collector: jetcollector / jet123</p>
        <p>Vendor: gimangvendor / gimang123</p>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    // ---- Force seed refresh if old email format detected ----
    (function(){
      try {
        var raw = localStorage.getItem(KEYS.users);
        if (raw) {
          var stored = JSON.parse(raw);
          // If stored users still have the old @market.ph emails, wipe and reseed
          var hasOld = stored.some(function(u){ return u.email && u.email.indexOf('@') !== -1; });
          if (hasOld) localStorage.removeItem(KEYS.users);
        }
      } catch(e) {}
    })();

    // Redirect if already logged in
    (function(){
      var s = getSession();
      if (s) window.location.href = dashboardFor(s.role);
    })();

    function doLogin() {
      var email    = document.getElementById('loginEmail').value.trim().toLowerCase();
      var password = document.getElementById('loginPassword').value;
      var errEl    = document.getElementById('loginError');
      errEl.textContent = '';

      if (!email || !password) {
        errEl.textContent = 'Please enter your email and password.';
        return;
      }

      var users = dbGet(KEYS.users, SEED_USERS);
      var user  = users.find(function(u){ return u.email.toLowerCase() === email && u.password === password; });

      if (!user) {
        errEl.textContent = 'Invalid email or password. Please try again.';
        return;
      }
      if (user.status !== 'Active') {
        errEl.textContent = 'Your account is inactive. Contact the administrator.';
        return;
      }

      setSession({ id: user.id, name: user.name, email: user.email, role: user.role });
      window.location.href = dashboardFor(user.role);
    }

    // Allow Enter key
    document.addEventListener('keydown', function(e){
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body>
</html>
