<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Public Market Stall Vendor System</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">

      <div class="auth-logo">
        <div class="auth-logo-icon">
          <i class="ri-store-2-line"></i>
        </div>
        <h1 class="auth-title">Public Market Stall<br>Vendor System</h1>
        <p class="auth-subtitle">Minglanilla Public Market</p>
      </div>

      <h2 class="auth-form-title">Sign In</h2>
      <p class="form-error" id="loginError"></p>

      <div class="form-group">
        <label>Username <span class="required">*</span></label>
        <input type="text" id="loginEmail" class="form-input" placeholder="Enter your username" autocomplete="username" />
      </div>

      <div class="form-group">
        <label>Password <span class="required">*</span></label>
        <div class="password-field">
          <input type="password" id="loginPassword" class="form-input" placeholder="Enter your password" autocomplete="current-password" />
          <button type="button" class="password-toggle" onclick="togglePassword('loginPassword', 'loginPassIcon')" tabindex="-1" aria-label="Toggle password visibility">
            <i class="ri-eye-off-line" id="loginPassIcon"></i>
          </button>
        </div>
      </div>

      <button class="btn-primary btn-full" onclick="doLogin()">
        <i class="ri-login-box-line"></i> Sign In
      </button>

      <div class="auth-footer">
        <p>Don't have an account? <a href="register.html">Register here</a></p>
        <p><a href="index.html"><i class="ri-arrow-left-line"></i> Back to Home</a></p>
      </div>

      <div class="auth-demo">
        <p><strong>Demo Accounts</strong></p>
        <p>Supervisor: perezvisor / perez123</p>
        <p>Collector: jetcollector / jet123</p>
        <p>Vendor: gimangvendor / gimang123</p>
      </div>

    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    /* ---- force seed refresh if old email format stored ---- */
    (function(){
      try {
        var raw = localStorage.getItem(KEYS.users);
        if (raw) {
          var stored = JSON.parse(raw);
          var hasOld = stored.some(function(u){ return u.email && u.email.indexOf('@') !== -1; });
          if (hasOld) localStorage.removeItem(KEYS.users);
        }
      } catch(e) {}
    })();

    /* ---- redirect if already logged in ---- */
    (function(){
      var s = getSession();
      if (s) window.location.href = dashboardFor(s.role);
    })();

    /* ---- password visibility toggle ---- */
    function togglePassword(inputId, iconId) {
      var input = document.getElementById(inputId);
      var icon  = document.getElementById(iconId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'ri-eye-line';
      } else {
        input.type = 'password';
        icon.className = 'ri-eye-off-line';
      }
    }

    /* ---- login ---- */
    function doLogin() {
      var email    = document.getElementById('loginEmail').value.trim().toLowerCase();
      var password = document.getElementById('loginPassword').value;
      var errEl    = document.getElementById('loginError');
      errEl.textContent = '';

      if (!email || !password) {
        errEl.textContent = 'Please enter your username and password.';
        return;
      }

      var users = dbGet(KEYS.users, SEED_USERS);
      var user  = users.find(function(u){
        return u.email.toLowerCase() === email && u.password === password;
      });

      if (!user) {
        errEl.textContent = 'Invalid username or password. Please try again.';
        return;
      }
      if (user.status !== 'Active') {
        errEl.textContent = 'Your account is inactive. Contact the administrator.';
        return;
      }

      setSession({ id: user.id, name: user.name, email: user.email, role: user.role });
      window.location.href = dashboardFor(user.role);
    }

    document.addEventListener('keydown', function(e){
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body>
</html>
